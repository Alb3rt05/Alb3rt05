<svg width="500" height="110" viewBox="0 0 500 110" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg {
      fill: #0d0d0d;
      stroke: #1a1a1a;
      stroke-width: 2;
    }
    .bezel {
      fill: none;
      stroke: #222;
      stroke-width: 1;
    }
    .game-over-txt {
      font-family: 'Courier New', Courier, monospace;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 8px;
      fill: #FF0080;
      text-anchor: middle;
      animation: flicker 2.5s infinite alternate ease-in-out;
    }
    .sub-txt {
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      fill: #00FF41;
      text-anchor: middle;
      letter-spacing: 3px;
    }
    .invader {
      fill: #FF0080;
      animation: invader-color 4s infinite step-start, invader-wiggle 1s infinite alternate ease-in-out;
      transform-origin: center;
    }
    .scanlines {
      fill: url(#scanline-pattern);
      opacity: 0.05;
      pointer-events: none;
    }
    .blink {
      animation: blink-anim 1s step-start infinite;
      fill: #00FF41;
    }
    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        filter: drop-shadow(0 0 6px rgba(255, 0, 128, 0.8));
        opacity: 1;
      }
      20%, 24%, 55% {
        filter: drop-shadow(0 0 2px rgba(255, 0, 128, 0.3));
        opacity: 0.85;
      }
    }
    @keyframes invader-color {
      0%, 100% { fill: #FF0080; }
      50% { fill: #FFD700; }
    }
    @keyframes invader-wiggle {
      0% { transform: scale(1.5) translate(0, 0); }
      100% { transform: scale(1.5) translate(0, -2px); }
    }
    @keyframes blink-anim {
      50% { opacity: 0; }
    }
  </style>
  <defs>
    <pattern id="scanline-pattern" width="100" height="4" patternUnits="userSpaceOnUse">
      <rect width="100" height="2" fill="#fff"/>
    </pattern>
  </defs>
  
  <rect width="500" height="110" rx="8" class="bg"/>
  <rect x="6" y="6" width="488" height="98" rx="5" class="bezel"/>
  <rect width="500" height="110" rx="8" class="scanlines"/>
  
  <g transform="translate(239, 14)">
    <path class="invader" d="M4,0h2v2h-2z M16,0h2v2h-2z M6,2h2v2h-2z M14,2h2v2h-2z M4,4h14v2h-14z M2,6h4v2h-4z M8,6h6v2h-6z M16,6h4v2h-4z M0,8h22v2h-22z M0,10h2v2h-2z M4,10h14v2h-14z M20,10h2v2h-2z M0,12h2v2h-2z M4,12h2v2h-2z M16,12h2v2h-2z M20,12h2v2h-2z M6,14h4v2h-4z M12,14h4v2h-4z"/>
  </g>
  
  <text x="254" y="65" class="game-over-txt">GAME OVER</text>
  <text x="250" y="88" class="sub-txt">SEE YOU NEXT COMMIT<tspan class="blink">█</tspan></text>
</svg>
