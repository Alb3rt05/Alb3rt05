<svg width="240" height="50" viewBox="0 0 240 50" xmlns="http://www.w3.org/2000/svg">
  <style>
    .badge-bg {
      fill: #070707;
      stroke: #161616;
      stroke-width: 1;
      transition: all 0.3s ease-in-out;
    }
    .bracket {
      stroke: #FF0080;
      stroke-width: 2;
      fill: none;
      transition: all 0.3s ease-in-out;
    }
    .status-dot {
      fill: #FF0080;
      animation: pulse-dot 1.5s infinite alternate ease-in-out;
    }
    .icon {
      stroke: #888;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.3s ease-in-out;
    }
    .left-text {
      fill: #888;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.5px;
      transition: all 0.3s ease-in-out;
    }
    .separator {
      stroke: #161616;
      stroke-width: 1;
      transition: all 0.3s ease-in-out;
    }
    .right-text {
      fill: #FF0080;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .cover-rect {
      fill: #070707;
      animation: typewrite-cover 1.2s steps(9) 0.5s forwards;
      transition: fill 0.3s ease-in-out;
    }
    .cursor {
      fill: #FF0080;
      animation: typewrite-cursor 1.2s steps(9) 0.5s forwards, blink 1s step-start infinite;
    }

    /* Hover States */
    svg:hover .badge-bg {
      fill: #0e0e0e;
      stroke: #FF0080;
    }
    svg:hover .separator {
      stroke: #FF0080;
      opacity: 0.5;
    }
    svg:hover .left-text {
      fill: #ffffff;
    }
    svg:hover .icon {
      stroke: #ffffff;
      transform: scale(1.05);
      transform-origin: 43px 25px;
    }
    svg:hover .cover-rect {
      fill: #0e0e0e;
    }
    svg:hover .tl { transform: translate(-2px, -2px); }
    svg:hover .tr { transform: translate(2px, -2px); }
    svg:hover .bl { transform: translate(-2px, 2px); }
    svg:hover .br { transform: translate(2px, 2px); }

    @keyframes pulse-dot {
      0% { opacity: 0.3; filter: drop-shadow(0 0 1px #FF0080); }
      100% { opacity: 1; filter: drop-shadow(0 0 4px #FF0080); }
    }
    @keyframes typewrite-cover {
      from { x: 120px; width: 100px; }
      to { x: 220px; width: 0px; }
    }
    @keyframes typewrite-cursor {
      from { x: 120px; }
      to { x: 220px; }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
  <rect x="6" y="6" width="228" height="38" rx="4" class="badge-bg"/>
  
  <!-- Corner Brackets -->
  <path d="M 6,14 V 6 H 14" class="bracket tl"/>
  <path d="M 226,6 H 234 V 14" class="bracket tr"/>
  <path d="M 6,36 V 44 H 14" class="bracket bl"/>
  <path d="M 226,44 H 234 V 36" class="bracket br"/>
  
  <!-- Content -->
  <circle cx="22" cy="25" r="3" class="status-dot"/>
  <g transform="translate(35, 17)">
    <rect x="1" y="2" width="14" height="11" rx="1.5" class="icon"/>
    <path d="M1 3.5l7 5 7-5" class="icon"/>
  </g>
  <text x="58" y="28" class="left-text">EMAIL</text>
  
  <line x1="105" y1="12" x2="105" y2="38" class="separator"/>
  
  <text x="120" y="28" class="right-text">say hello</text>
  
  <!-- Typing cover and cursor -->
  <rect x="120" y="10" width="100" height="30" class="cover-rect"/>
  <rect x="120" y="19" width="6" height="12" class="cursor"/>
</svg>
