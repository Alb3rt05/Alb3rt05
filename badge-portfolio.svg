<svg width="360" height="50" viewBox="0 0 360 50" xmlns="http://www.w3.org/2000/svg">
  <style>
    .badge-bg {
      fill: #070707;
      stroke: #161616;
      stroke-width: 1;
      transition: all 0.3s ease-in-out;
    }
    .bracket {
      stroke: #00FF41;
      stroke-width: 2;
      fill: none;
      transition: all 0.3s ease-in-out;
    }
    .status-dot {
      fill: #00FF41;
      animation: pulse-dot 1.5s infinite alternate ease-in-out;
    }
    .icon {
      stroke: #888;
      stroke-width: 1.5;
      fill: none;
      transition: all 0.3s ease-in-out;
    }
    .left-text {
      fill: #888;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1.5px;
      transition: all 0.3s ease-in-out;
    }
    .separator {
      stroke: #161616;
      stroke-width: 1;
      transition: all 0.3s ease-in-out;
    }
    .right-text {
      fill: #00FF41;
      font-family: 'Courier New', Courier, monospace;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .cover-rect {
      fill: #070707;
      animation: typewrite-cover 2s steps(27) 0.5s forwards;
      transition: fill 0.3s ease-in-out;
    }
    .cursor {
      fill: #00FF41;
      animation: typewrite-cursor 2s steps(27) 0.5s forwards, blink 1s step-start infinite;
    }

    /* Hover States */
    svg:hover .badge-bg {
      fill: #0e0e0e;
      stroke: #00FF41;
    }
    svg:hover .separator {
      stroke: #00FF41;
      opacity: 0.5;
    }
    svg:hover .left-text {
      fill: #ffffff;
    }
    svg:hover .icon {
      stroke: #ffffff;
      transform: scale(1.05);
      transform-origin: 43px 25px;
    }
    svg:hover .cover-rect {
      fill: #0e0e0e;
    }
    svg:hover .tl { transform: translate(-2px, -2px); }
    svg:hover .tr { transform: translate(2px, -2px); }
    svg:hover .bl { transform: translate(-2px, 2px); }
    svg:hover .br { transform: translate(2px, 2px); }

    @keyframes pulse-dot {
      0% { opacity: 0.3; filter: drop-shadow(0 0 1px #00FF41); }
      100% { opacity: 1; filter: drop-shadow(0 0 4px #00FF41); }
    }
    @keyframes typewrite-cover {
      from { x: 150px; width: 195px; }
      to { x: 345px; width: 0px; }
    }
    @keyframes typewrite-cursor {
      from { x: 150px; }
      to { x: 345px; }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
  <rect x="6" y="6" width="348" height="38" rx="4" class="badge-bg"/>
  
  <!-- Corner Brackets -->
  <path d="M 6,14 V 6 H 14" class="bracket tl"/>
  <path d="M 346,6 H 354 V 14" class="bracket tr"/>
  <path d="M 6,36 V 44 H 14" class="bracket bl"/>
  <path d="M 346,44 H 354 V 36" class="bracket br"/>
  
  <!-- Content -->
  <circle cx="22" cy="25" r="3" class="status-dot"/>
  <g transform="translate(35, 17)">
    <circle cx="8" cy="8" r="6" class="icon"/>
    <path d="M2 8h12M8 2a14 14 0 0 0 0 12 14 14 0 0 0 0-12" class="icon"/>
  </g>
  <text x="58" y="28" class="left-text">PORTFOLIO</text>
  
  <line x1="135" y1="12" x2="135" y2="38" class="separator"/>
  
  <text x="150" y="28" class="right-text">albertocostanzo.netlify.app</text>
  
  <!-- Typing cover and cursor -->
  <rect x="150" y="10" width="195" height="30" class="cover-rect"/>
  <rect x="150" y="19" width="6" height="12" class="cursor"/>
</svg>
