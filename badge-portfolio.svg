    }
    .left-bg {
      fill: #00FF41;
    }
    .left-text {
      fill: #0d0d0d;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }
    .right-text {
      fill: #00FF41;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    @keyframes pulse-glow-green {
      0% {
        stroke: #008f25;
        filter: drop-shadow(0 0 1px rgba(0, 255, 65, 0.2));
      }
      100% {
        stroke: #00FF41;
        filter: drop-shadow(0 0 4px rgba(0, 255, 65, 0.7));
      }
