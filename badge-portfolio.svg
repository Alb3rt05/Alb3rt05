<svg width="310" height="45" viewBox="0 0 310 45" xmlns="http://www.w3.org/2000/svg">
  <style>
    .badge {
      fill: #0d0d0d;
      stroke: #00FF41;
      stroke-width: 1.5;
      transition: all 0.3s ease-in-out;
      animation: pulse-glow-green 2.5s infinite alternate ease-in-out;
    }
    .left-bg {
      fill: #00FF41;
      transition: all 0.3s ease-in-out;
    }
    .left-text {
      fill: #0d0d0d;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      transition: all 0.3s ease-in-out;
    }
    .right-text {
      fill: #00FF41;
      font-family: 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
      transition: all 0.3s ease-in-out;
    }
    .icon {
      stroke: #0d0d0d;
      stroke-width: 1.5;
      fill: none;
      transition: all 0.3s ease-in-out;
    }

    /* Hover States triggered by parent SVG hover */
    svg:hover .badge {
      fill: #121212;
      stroke: #00FF41;
      stroke-width: 2.0;
      animation: pulse-glow-green-hover 1s infinite alternate ease-in-out;
    }
    svg:hover .left-bg {
      fill: #ffffff;
    }
    svg:hover .left-text {
      fill: #0d0d0d;
    }
    svg:hover .right-text {
      fill: #ffffff;
      text-shadow: 0 0 8px #00FF41;
    }
    svg:hover .icon {
      stroke: #0d0d0d;
      transform: scale(1.1) rotate(5deg);
      transform-origin: 20px 22px;
    }

    @keyframes pulse-glow-green {
      0% {
        stroke: #008f25;
        filter: drop-shadow(0 0 1px rgba(0, 255, 65, 0.2));
      }
      100% {
        stroke: #00FF41;
        filter: drop-shadow(0 0 4px rgba(0, 255, 65, 0.6));
      }
    }
    @keyframes pulse-glow-green-hover {
      0% {
        filter: drop-shadow(0 0 4px rgba(0, 255, 65, 0.6));
      }
      100% {
        filter: drop-shadow(0 0 10px rgba(0, 255, 65, 0.9));
      }
    }
  </style>
  <rect x="1" y="1" width="308" height="43" rx="6" class="badge"/>
  <path d="M1 7 C1 3.5, 3.5 1, 7 1 H110 L95 44 H7 C3.5 44, 1 41.5, 1 38 Z" class="left-bg"/>
  <g transform="translate(12, 14)">
    <circle cx="8" cy="8" r="6" class="icon"/>
    <path d="M2 8h12M8 2a14 14 0 0 0 0 12 14 14 0 0 0 0-12" class="icon"/>
  </g>
  <text x="34" y="27" class="left-text">PORTFOLIO</text>
  <text x="115" y="27" class="right-text">albertocostanzo.netlify.app</text>
</svg>
